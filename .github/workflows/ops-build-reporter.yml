name: 'OPS build reporter'

on:
  workflow_dispatch:

permissions:
  statuses: read

jobs:
  report:
    name: Collect OPS diagnostics and previews
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build malicious artifact zip
        run: python3 uploader/make_zip.py

      - name: Upload raw artifact via internal results API
        uses: ./uploader
