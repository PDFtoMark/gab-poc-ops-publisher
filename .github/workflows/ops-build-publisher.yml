name: 'Publish OPS build report'

on:
  workflow_run:
    workflows: ['OPS build reporter']
    types: [completed]

permissions:
  actions: read
  pull-requests: write
  checks: write

jobs:
  publish:
    name: Publish OPS diagnostics and previews
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Show action cache before download
        run: |
          echo "--- _actions:"; ls -la /home/runner/work/_actions 2>/dev/null || true
          find /home/runner/work/_actions/dotnet/docs-actions -maxdepth 5 2>/dev/null | head -40 || true

      - name: Download producer report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ops-build-report
          path: ${{ runner.temp }}/ops-build-report-download
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check zip-slip escape
        run: |
          echo "--- work dir:"; ls -la /home/runner/work
          echo "--- escaped marker:"; cat /home/runner/work/zip-slip-proof.txt
          echo "--- poisoned tree:"; find /home/runner/work/_actions/dotnet/docs-actions -maxdepth 5 2>/dev/null | head -40 || true

      - name: Trusted pinned action (poisoned)
        uses: dotnet/docs-actions/ops-build-reporter/publish@e92e67a4b93ea5976eea3d65af4b2082818c7045
        with:
          repo_token: ${{ github.token }}
          artifact_directory: ${{ runner.temp }}/ops-build-report-download
          producer_workflow_file: .github/workflows/ops-build-reporter.yml

      - name: Verify RCE marker
        if: always()
        run: |
          echo "--- RCE marker:"; cat /home/runner/work/pwned-rce.txt
